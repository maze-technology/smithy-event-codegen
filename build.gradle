plugins {
  id("java-library")
  id("maven-publish")
}

group = "tech.maze"

ext {
  smithyVersion = "1.73.0"
}

repositories {
  mavenLocal()
  mavenCentral()
}

dependencies {
  implementation "software.amazon.smithy:smithy-build:$smithyVersion"
  implementation "software.amazon.smithy:smithy-model:$smithyVersion"
}

jar {
  enabled = true
  archiveClassifier = ""

  manifest {
    attributes(
      "Implementation-Title": project.name,
      "Implementation-Version": project.version,
    )
  }
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
  withSourcesJar()
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
    }
  }

  repositories {
    maven {
      name = "gitlab"
      url = System.getenv("GITLAB_MAVEN_URL") ?: "https://scm.maze.trading/api/v4/groups/6/-/packages/maven"

      credentials {
        username = System.getenv("GITLAB_MAVEN_USER") ?: "gitlab-ci-token"
        password = System.getenv("CI_JOB_TOKEN") ?: System.getenv("GITLAB_MAVEN_PASSWORD") ?: System.getenv("GITLAB_TOKEN")
      }
    }
  }
}

tasks.register("printCoordinates") {
  doLast {
    println("group=${project.group}")
    println("artifactId=${project.name}")
  }
}
